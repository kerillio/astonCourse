services:
  kafka:
    image: apache/kafka:3.9.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      # Уникальный ID узла и его роль (одновременно брокер и контроллер)
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      # Порты прослушивания внутри контейнера
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      # Адрес, по которому ваши Spring Boot приложения подключаются снаружи (с хоста)
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092

      # Настройки безопасности и связи контроллера
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093

      # Фактор репликации (для 1 брокера обязательно 1, иначе топики не создадутся)
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
